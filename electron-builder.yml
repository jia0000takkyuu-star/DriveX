appId: com.jia0000takkyuu-star.drivex
productName: DriveX
artifactName: DriveX-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - main.js
  - package.json
win:
  target:
    - nsis
    - portable
  icon: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: DriveX-${version}-portable.exe
